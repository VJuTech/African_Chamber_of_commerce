services:
  app:
    build: .
    environment:
      NODE_ENV: development
      DEPLOYMENT_ENV: development
      DATABASE_URL: postgresql://acc:acc@postgres:5432/acc
      PORT: 5500
    ports:
      - "5500:5500"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acc
      POSTGRES_USER: acc
      POSTGRES_PASSWORD: acc
    volumes:
      - acc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acc -d acc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  acc-postgres-data:
